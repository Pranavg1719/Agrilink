<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="100%" stop-color="#e9edd8"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <!-- Field lines -->
  <path d="M 0 350 Q 300 280 600 350 L 600 400 L 0 400 Z" fill="#d9dfbe"/>
  <path d="M 0 310 Q 300 250 600 310 L 600 360 L 0 360 Z" fill="#ccd6ac"/>
  <!-- Wheat Stalks -->
  <g transform="translate(300, 220)">
    <!-- Central stalk -->
    <path d="M 0 100 Q 10 20 0 -90" stroke="#a16207" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- Grains -->
    <ellipse cx="-16" cy="-80" rx="9" ry="18" transform="rotate(-35 -16 -80)" fill="url(#gold)"/>
    <ellipse cx="16" cy="-80" rx="9" ry="18" transform="rotate(35 16 -80)" fill="url(#gold)"/>
    <ellipse cx="-18" cy="-50" rx="10" ry="20" transform="rotate(-35 -18 -50)" fill="url(#gold)"/>
    <ellipse cx="18" cy="-50" rx="10" ry="20" transform="rotate(35 18 -50)" fill="url(#gold)"/>
    <ellipse cx="-18" cy="-20" rx="10" ry="20" transform="rotate(-35 -18 -20)" fill="url(#gold)"/>
    <ellipse cx="18" cy="-20" rx="10" ry="20" transform="rotate(35 18 -20)" fill="url(#gold)"/>
    <ellipse cx="-16" cy="10" rx="10" ry="19" transform="rotate(-35 -16 10)" fill="url(#gold)"/>
    <ellipse cx="16" cy="10" rx="10" ry="19" transform="rotate(35 16 10)" fill="url(#gold)"/>
    <ellipse cx="0" cy="-105" rx="8" ry="16" fill="url(#gold)"/>
  </g>
  <text x="300" y="375" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="22" fill="#78350f">
    Fresh Harvest Wheat • Sharbati Grade
  </text>
</svg>
