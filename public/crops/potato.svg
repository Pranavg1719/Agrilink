<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_pot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <radialGradient id="pot_grad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="60%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg_pot)"/>
  <!-- Potato tuber -->
  <g transform="translate(300, 200)">
    <path d="M -120 10 C -125 -60, -50 -105, 30 -95 C 100 -85, 135 -40, 130 30 C 125 90, 60 115, -20 110 C -85 105, -115 70, -120 10 Z" fill="url(#pot_grad)"/>
    <!-- Potato eyes / indentations -->
    <ellipse cx="-55" cy="-35" rx="8" ry="4" transform="rotate(-15 -55 -35)" fill="#451a03"/>
    <ellipse cx="25" cy="-45" rx="10" ry="4.5" transform="rotate(10 25 -45)" fill="#451a03"/>
    <ellipse cx="65" cy="15" rx="9" ry="4" transform="rotate(-20 65 15)" fill="#451a03"/>
    <ellipse cx="-30" cy="40" rx="10" ry="4" transform="rotate(15 -30 40)" fill="#451a03"/>
    <ellipse cx="10" cy="55" rx="7" ry="3" transform="rotate(-5 10 55)" fill="#451a03"/>
  </g>
  <text x="300" y="375" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="22" fill="#78350f">
    Fresh Harvest Potatoes • Kufri Jyoti Table Grade
  </text>
</svg>
