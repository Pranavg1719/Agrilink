<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_tom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5f5"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
    <radialGradient id="tom_grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="70%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </radialGradient>
    <radialGradient id="shine" cx="30%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg_tom)"/>
  <!-- Tomato body -->
  <g transform="translate(300, 200)">
    <circle cx="-50" cy="15" r="95" fill="url(#tom_grad)"/>
    <circle cx="50" cy="15" r="95" fill="url(#tom_grad)"/>
    <circle cx="0" cy="20" r="105" fill="url(#tom_grad)"/>
    <!-- Specular highlight -->
    <ellipse cx="-35" cy="-25" rx="35" ry="20" transform="rotate(-25 -35 -25)" fill="url(#shine)"/>
    <!-- Green Calyx / Leaves -->
    <path d="M 0 -85 C -20 -115, -45 -110, -55 -105 C -40 -90, -25 -85, 0 -85 Z" fill="#15803d"/>
    <path d="M 0 -85 C 20 -115, 45 -110, 55 -105 C 40 -90, 25 -85, 0 -85 Z" fill="#15803d"/>
    <path d="M 0 -85 C -15 -130, -5 -145, 0 -150 C 5 -145, 15 -130, 0 -85 Z" fill="#166534"/>
    <path d="M -5 -85 C -50 -75, -70 -65, -80 -60 C -65 -60, -45 -70, -5 -85 Z" fill="#15803d"/>
    <path d="M 5 -85 C 50 -75, 70 -65, 80 -60 C 65 -60, 45 -70, 5 -85 Z" fill="#15803d"/>
    <!-- Stem -->
    <path d="M 0 -85 Q 10 -110 5 -125" stroke="#14532d" stroke-width="8" stroke-linecap="round" fill="none"/>
  </g>
  <text x="300" y="375" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="22" fill="#991b1b">
    Red Hybrid Tomatoes • Nashik APMC Standard
  </text>
</svg>
